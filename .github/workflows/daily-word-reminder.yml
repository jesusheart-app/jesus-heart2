name: Daily word reminder

on:
  schedule:
    # GitHub 예약 지연에 대비해 매시 13분과 43분에 확인합니다.
    # 실제 발송은 스크립트의 한국 시간표와 일일 발송 기록으로 하루 한 번만 처리합니다.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "오늘 이미 발송했어도 테스트 알림 보내기"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run send-reminder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
